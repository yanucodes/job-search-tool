<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Search{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <nav class="toolbar">
      <a href="{{ url_for('review') }}" class="button">Review new jobs</a>
      {% for label, url in nav_pages %}
      <a href="{{ url }}" class="button">{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="toolbar">
      <a href="{{ url_for('new_application') }}" class="button">Add manually</a>
      {% if has_entries %}
      <form method="GET" action="{{ url_for('applications_pdf') }}"
            target="_blank">
        <label for="pdf-start">Applied from: </label>
        <input type="date" id="pdf-start" name="start">
        <label for="pdf-end">to: </label>
        <input type="date" id="pdf-end" name="end">
        <input type="submit" value="Generate PDF">
      </form>
      {% endif %}
    </div>
    {% block content %}{% endblock %}
  </body>
</html>
